name: Analizar PR

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Obtener información del PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            let totalAdditions = 0;
            let totalDeletions = 0;
            let filesModified = 0;
            const fileList = [];
            
            files.forEach(file => {
              totalAdditions += file.additions;
              totalDeletions += file.deletions;
              filesModified += 1;
              fileList.push(`- **${file.filename}** (+${file.additions} -${file.deletions})`);
            });
            
            const analysisComment = `## 🔍 Análisis del PR

            **Estadísticas de cambios:**
            - 📝 Archivos modificados: ${filesModified}
            - ✅ Líneas añadidas: ${totalAdditions}
            - ❌ Líneas eliminadas: ${totalDeletions}
            - 📊 Total de cambios: ${totalAdditions + totalDeletions}

            **Archivos cambiados:**
            ${fileList.join('\n')}

            **Resumen:**
            ${pullRequest.title}

            ${pullRequest.body || 'No hay descripción'}

            ---
            ✨ Análisis completado por GitHub Actions`;
                        
                        github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: analysisComment
                        })
