name: Analizar PR

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
      - name: Comentar análisis del PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔍 Se va a analizar este PR con GitHub Copilot...\n\nEsperando resultados del análisis...'
            })
