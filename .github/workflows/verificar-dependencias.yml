name: Verificar dependencias

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Verificar sintaxis Python
        run: python -m py_compile app.py doc_to_md.py
      
      - name: ✅ Todas las verificaciones pasaron
        run: echo "✅ Todas las dependencias están correctas y el código compila"
